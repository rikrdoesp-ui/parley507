<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline'; img-src data: 'self' https://cdn.nba.com; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#16202C">
<link rel="icon" href="icono.svg?v=0.1.29" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-180.png?v=0.1.29">

<title>parley507 v0.1.29</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Arena: concreto, tinta azul noche, dos lados (over verde duela, under azul) y el ámbar del reloj de tiro. */
:root{
  --fondo:#EDF0F3; --bloque:#FFFFFF; --tinta:#16202C; --suave:#5A6675; --regla:#D4DAE2; --pista:#E3E8EE;
  --over:#0E7A5A; --under:#2C56C9; --reloj:#E3A008; --reloj-tinta:#16202C; --vivo:#C2410C;
  --pos:#0E7A5A; --neg:#B5473A; --duda:#9A5B00;
  --cond:"Barlow Condensed","Arial Narrow",sans-serif; --texto:"Barlow",system-ui,sans-serif;
  --logo-fondo:#16202C;
  --panama-azul:#0B3D91; --panama-rojo:#D21034; --panama-blanco:transparent; --panama-blanco-borde:1.6px #16202C; --panama-blanco-respaldo:#16202C;
}
@media (prefers-color-scheme:dark){:root{
  --fondo:#121B27; --bloque:#1A2534; --tinta:#E6ECF3; --suave:#93A1B3; --regla:#2A374A; --pista:#253245;
  --over:#3DBB8C; --under:#7C9CFF; --reloj:#F0B429; --reloj-tinta:#121B27; --vivo:#FB7A3C;
  --pos:#3DBB8C; --neg:#F07D6B; --duda:#F0B429;
  --logo-fondo:#26354B;
  --panama-azul:#4F8BFF; --panama-rojo:#F0475E; --panama-blanco:#FFFFFF; --panama-blanco-borde:0 transparent; --panama-blanco-respaldo:#FFFFFF;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font:16px/1.45 var(--texto);font-variant-numeric:tabular-nums}
a{color:inherit}
:focus-visible{outline:2px solid var(--under);outline-offset:2px;border-radius:4px}
.envoltura{max-width:720px;margin:0 auto;padding:0 16px}
/* En PC se aprovecha el ancho: listas en columnas en vez de una sola tira angosta al centro. */
.rejilla>.vacio,.rejilla>.nota{grid-column:1/-1}
@media (min-width:1100px){
  .envoltura{max-width:1320px}
  .rejilla{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px;align-items:start}
  .rejilla.tres{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rejilla>details.bloque{margin-bottom:16px}
  .partido:nth-child(-n+3){border-top:1px solid var(--regla)}
}

/* Cabecera: el nombre como rótulo de camiseta; el estado del día en pares dato-valor. */
header{padding:18px 0 10px}
/* Marca: el logo (P con balón y barra) y el nombre. "parley" inclinado como rotulación deportiva; "507" (código de
   Panamá) con los colores de la bandera: 5 azul, 0 blanco (delineado en modo claro para que no se pierda), 7 rojo. */
.marca{display:flex;align-items:center;gap:12px}
.marca svg{width:48px;height:48px;flex:none}
.marca h1{margin:0;display:flex;align-items:baseline;line-height:.9}
.parley{font:italic 800 40px/.9 var(--cond);letter-spacing:-.5px}
.dorsal{font:italic 800 40px/.9 var(--cond);letter-spacing:.5px;margin-left:3px}
.dorsal .d5{color:var(--panama-azul)} .dorsal .d7{color:var(--panama-rojo)}
.dorsal .d0{color:var(--panama-blanco-respaldo)}
@supports (-webkit-text-stroke:1px black){.dorsal .d0{color:var(--panama-blanco);-webkit-text-stroke:var(--panama-blanco-borde)}}
.version{font:500 15px/1 var(--cond);color:var(--suave);align-self:flex-end;margin-bottom:2px}
.recargar{margin-left:auto;font:600 17px/1 var(--cond);min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--regla);background:var(--bloque);color:var(--tinta);cursor:pointer}
.recargar[aria-busy=true]{opacity:.6}
.estado{display:flex;flex-wrap:wrap;gap:4px 18px;margin:10px 0 0;font-size:13px}
.estado div{display:flex;gap:6px}
.estado dt{color:var(--suave)}
.estado dd{margin:0;font-weight:500}

/* Pestañas: texto, con subrayado grueso en la activa. */
nav{position:sticky;top:0;z-index:3;background:var(--fondo);border-bottom:1px solid var(--regla)}
nav .envoltura{display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
nav button{flex:0 0 auto;border:0;background:none;color:var(--suave);font:600 18px/1 var(--cond);padding:15px 7px 12px;min-height:48px;
  border-bottom:3px solid transparent;cursor:pointer}
nav button[aria-selected=true]{color:var(--tinta);border-bottom-color:var(--tinta)}
main{padding-top:14px;padding-bottom:48px}

.suave{color:var(--suave)}
.pequeno{font-size:13px}
.vacio{color:var(--suave);text-align:center;padding:36px 0}
.nota{color:var(--suave);font-size:13px;line-height:1.5;max-width:62ch;margin:14px 0}
.aviso{border-left:3px solid var(--duda);padding:8px 12px;margin:0 0 12px;font-size:14px;background:var(--bloque);border-radius:0 8px 8px 0}

/* Reloj de tiro: neutro si falta tiempo, ámbar a 30 min o menos, naranja en juego, gris al final. */
.reloj{display:inline-flex;align-items:center;gap:6px;font:600 15px/1 var(--cond);padding:4px 8px;border-radius:6px;
  border:1px solid var(--regla);white-space:nowrap}
.reloj.pronto{background:var(--reloj);border-color:var(--reloj);color:var(--reloj-tinta)}
.reloj.vivo{border-color:var(--vivo);color:var(--vivo)}
.reloj.vivo::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--vivo)}
.reloj.final{color:var(--suave)}

/* Partidos como renglones de tablero. */
.partido{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:14px 2px;
  border-bottom:1px solid var(--regla);text-decoration:none}
.partido:first-child{border-top:1px solid var(--regla)}
.cruce{font:700 26px/1.05 var(--cond);letter-spacing:.3px}
.cruce .arroba{color:var(--suave);font-weight:500;padding:0 3px}
.partido .detalle{grid-column:1/-1;display:flex;gap:14px;font-size:13px;color:var(--suave)}

/* Barra de probabilidad: relleno del color del lado; la marca fina es el mercado sin margen. */
.barra{position:relative;height:6px;background:var(--pista);border-radius:3px;margin:7px 0 6px}
.barra i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.barra.over i{background:var(--over)}
.barra.under i{background:var(--under)}
.barra b{position:absolute;top:-3px;width:2px;height:12px;background:var(--tinta);border-radius:1px}

/* Fila de prop. */
.prop{padding:11px 0 9px;border-top:1px solid var(--regla)}
.prop .linea1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prop .quien{font-weight:600}
.prop .prob{font:700 24px/1 var(--cond);white-space:nowrap;flex-shrink:0}
.prop .linea2{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;font-size:13px;color:var(--suave)}
.prop .precio{display:flex;gap:10px}
.lado-over{color:var(--over);font-weight:600}
.lado-under{color:var(--under);font-weight:600}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.riesgo{color:var(--duda);font-size:13px}

/* Bloques plegables de partido (los únicos con fondo) y apartados por área. */
details.bloque{background:var(--bloque);border-radius:14px;padding:14px 14px 6px;margin:0 0 12px}
details.bloque>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding-bottom:8px}
details.bloque>summary::-webkit-details-marker,details.area>summary::-webkit-details-marker{display:none}
details.bloque>summary .detalle{grid-column:1/-1;font-size:13px;color:var(--suave);display:flex;gap:14px}
details.bloque>summary .cruce::after{content:"";display:inline-block;width:8px;height:8px;margin:0 0 5px 10px;
  border-right:2px solid var(--suave);border-bottom:2px solid var(--suave);transform:rotate(-45deg);transition:transform .15s}
details.bloque[open]>summary .cruce::after{transform:rotate(45deg)}
@media (prefers-reduced-motion:reduce){details.bloque>summary .cruce::after{transition:none}}
details.area{border-top:1px solid var(--regla)}
details.area>summary{list-style:none;cursor:pointer;padding:11px 0 11px 12px;position:relative}
details.area>summary::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:2px}
details.area.over>summary::before{background:var(--over)}
details.area.under>summary::before{background:var(--under)}
details.area>summary .titulo{font:600 19px/1.1 var(--cond)}
details.area>summary .cuantos{color:var(--suave);font-weight:400;margin-left:6px}
details.area>summary .mejor{display:block;font-size:13px;color:var(--suave);margin-top:2px}
details.area[open]>summary{padding-bottom:4px}
details.area .prop{margin-left:12px}

/* Vista de un partido. */
.volver{display:inline-block;text-decoration:none;color:var(--under);font-weight:500;padding:4px 0 10px}
.titulo-juego{display:flex;justify-content:space-between;align-items:center;gap:12px}
.titulo-juego .cruce{font-size:34px}
h2.seccion{font:700 22px/1.1 var(--cond);margin:26px 0 4px}
.equipo{font:700 22px/1.1 var(--cond);margin:28px 0 6px;padding-bottom:6px;border-bottom:2px solid var(--tinta)}

/* Ficha de jugador. */
.ficha{padding:14px 0;border-bottom:1px solid var(--regla)}
.ficha .encabezado{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ficha .nombre{font:600 21px/1.1 var(--cond);margin-right:auto}
.ficha .encabezado{align-items:center}
.ficha .foto{padding:0;border:0;background:var(--bloque);border-radius:10px;cursor:zoom-in;flex:none;line-height:0;overflow:hidden}
.ficha .foto img{width:64px;height:47px;object-fit:cover;object-position:top}
.visor{border:0;padding:0;border-radius:16px;background:var(--bloque);color:var(--tinta);width:min(92vw,520px);overflow:hidden}
.visor img{aspect-ratio:260/190}
.visor::backdrop{background:rgba(0,0,0,.6)}
.visor img{display:block;width:100%;height:auto;background:var(--fondo)}
.visor .pie{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;font-size:14px}
.visor .pie strong{font:600 22px/1 var(--cond)}
.visor .cerrar{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:26px;line-height:1;cursor:pointer}
.ficha .dorsal-jugador{color:var(--suave);font-weight:500}
.ficha .rol{display:block;font:500 13px/1.3 var(--texto);color:var(--over);margin-top:3px}
.ficha .rol.suplente{color:var(--suave)}
.sugerida{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin:8px 0 2px;padding:7px 10px;border-radius:8px;
  background:var(--bloque);border-left:3px solid var(--regla);font-size:14px}
.sugerida.over{border-left-color:var(--over)} .sugerida.under{border-left-color:var(--under)}
.sugerida .etiqueta{font-size:12px;color:var(--suave)}
.sugerida strong{font:700 17px/1.1 var(--cond)}
.ficha .datos{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:13px;color:var(--suave);margin-top:2px}
@media (max-width:420px){.ficha th:nth-child(4),.ficha td:nth-child(4){display:none}}
.estado-lesion{font:600 15px/1 var(--cond)}
.Out{color:var(--neg)} .Doubtful,.Questionable{color:var(--duda)} .Probable,.Available{color:var(--pos)}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
th{font-weight:500;color:var(--suave);text-align:right;padding:4px 3px;border-bottom:1px solid var(--regla)}
td{text-align:right;padding:6px 3px;border-bottom:1px solid var(--pista);vertical-align:top}
th:first-child,td:first-child{text-align:left}
td .bajo{display:block;font-size:12px;color:var(--suave)}
td.proy{font-weight:700}
details.escenarios{margin-top:8px;font-size:13px}
details.escenarios summary{cursor:pointer;color:var(--under)}

.controles{display:flex;gap:8px;margin-bottom:6px}
input,select{font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--regla);border-radius:8px;background:var(--bloque);color:var(--tinta);min-width:0}
input{flex:1}

/* Lesiones y modelo. */
.lesion{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:10px 0;border-bottom:1px solid var(--regla)}
.lesion .motivo{grid-column:1/-1;font-size:13px;color:var(--suave)}
.temporada{background:var(--bloque);border-radius:14px;padding:14px;margin-bottom:12px}
.temporada h2{font:700 22px/1 var(--cond);margin:0 0 4px}
td.gano{color:var(--over);font-weight:700}
.selector{display:flex;gap:6px;margin:0 0 12px}
.selector button{flex:1;min-height:44px;font:600 16px/1 var(--cond);border-radius:10px;border:1px solid var(--regla);background:transparent;color:var(--suave);cursor:pointer}
.selector button[aria-pressed=true]{background:var(--bloque);color:var(--tinta);border-color:var(--tinta)}
.marcador-aciertos{font:700 18px/1 var(--cond)}
h3.dia{font:600 18px/1 var(--cond);color:var(--suave);margin:16px 0 4px}
.combinada{border-top:1px solid var(--regla);padding:10px 0 4px}
.parley-cabeza{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-size:13.5px;margin-bottom:6px}
.parley-cabeza .titulo{font:700 20px/1 var(--cond)}
.leg{border-left:3px solid var(--regla);padding:4px 0 4px 10px;margin:8px 0}
.leg.over{border-color:var(--over)} .leg.under{border-color:var(--under)}
.leg-linea{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;font-size:15px}
.leg-p{margin-left:auto;font-weight:600}
.leg-p.gano{color:var(--over)} .leg-p.perdio{color:var(--panama-rojo)}
.estado-parley{margin-left:auto;font:700 16px/1 var(--cond);padding:4px 8px;border-radius:6px;border:1px solid var(--regla)}
.estado-parley.gano{color:var(--over);border-color:var(--over)} .estado-parley.perdio{color:var(--panama-rojo);border-color:var(--panama-rojo)}
.por-que{margin:4px 0 0;font-size:13px;line-height:1.45;color:var(--suave)}
td.perdio{color:var(--panama-rojo);font-weight:700}

@media (prefers-reduced-motion:no-preference){details[open]>*:not(summary){animation:abrir .18s ease-out}}
@keyframes abrir{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<script>
const D = JSON.parse(document.getElementById('datos').textContent);
const el = (tag, attrs = {}, ...hijos) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v; else if (k === 'style') n.style.cssText = v; else n.setAttribute(k, v);
  }
  for (const h of hijos.flat()) if (h !== null && h !== undefined && h !== '' && h !== false) n.append(h instanceof Node ? h : String(h));
  return n;
};
const vacio = x => x === null || x === undefined;
const pct = (x, d = 0) => vacio(x) ? '—' : (x * 100).toFixed(d) + ' %';
const num = (x, d = 1) => vacio(x) ? '—' : Number(x).toFixed(d);
const ve = x => vacio(x) ? '—' : `${x > 0 ? '+' : '−'}${Math.abs(x * 100).toFixed(1)} %`;
const signo = x => vacio(x) ? '' : x > 0 ? 'pos' : 'neg';
const ESTADISTICAS = {points: 'Puntos', rebounds: 'Rebotes', assists: 'Asistencias', pra: 'PRA', pr: 'PR', ra: 'RA'};
const MERCADOS = ['pts', 'reb', 'ast', 'pra', 'pr', 'ra'];
const NOMBRES = {pts: 'Puntos', reb: 'Rebotes', ast: 'Asistencias', puntos: 'Puntos', rebotes: 'Rebotes', asistencias: 'Asistencias',
  pra: 'PRA', pr: 'PR', ra: 'RA'};
const cruce = nombre => { const [a, b] = nombre.split(' @ '); return el('span', {class: 'cruce'}, a, el('span', {class: 'arroba'}, '@'), b || ''); };

// Estado del día.
const estado = document.getElementById('estado');
const duracion = m => m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}` : `${m} min`;
// La PC actualiza sola cada 30 min; aquí se ve cuánto hace y Recargar trae lo último publicado.
const haceTexto = () => {
  if (!D.generado_utc) return '';
  const min = Math.max(0, Math.round((Date.now() - Date.parse(D.generado_utc)) / 60000));
  return min < 1 ? 'recién' : `hace ${duracion(min)}`;
};
for (const [dt, dd] of [['Jornada', D.fecha], ['Actualizado', D.generado + ' (Panamá)'], ['Lesiones', D.reporte_lesiones]])
  if (dd) estado.append(el('div', {}, el('dt', {}, dt), el('dd', {}, dd, dt === 'Actualizado' ? el('span', {class: 'hace', id: 'hace'}, ', ' + haceTexto()) : null)));
document.getElementById('recargar').addEventListener('click', e => {
  e.currentTarget.setAttribute('aria-busy', 'true');
  e.currentTarget.textContent = 'Cargando...';
  // Dirección nueva para saltarse la caché de GitHub Pages (hasta 10 min).
  location.replace(location.pathname + '?t=' + Date.now() + location.hash);
});

// Reloj: cuenta regresiva hasta el inicio y, ya empezado, minutos desde el comienzo (reloj real, no el del partido).
function relojEstado(iso, est) {
  if (est === 'final') return ['final', 'Final'];
  if (!iso) return ['', ''];
  const min = Math.round((Date.parse(iso) - Date.now()) / 60000);
  if (min > 30) return ['', `en ${duracion(min)}`];
  if (min > 0) return ['pronto', `en ${min} min`];
  if (-min <= 180) return ['vivo', `en juego ${-min}'`];
  return ['final', 'debería haber terminado'];
}
const reloj = p => {
  const [clase, texto] = relojEstado(p.inicio, p.estado);
  return el('span', {class: 'reloj ' + clase, 'data-inicio': p.inicio || '', 'data-estado': p.estado || ''}, texto);
};
setInterval(() => { const h = document.getElementById('hace'); if (h) h.textContent = ', ' + haceTexto(); }, 30000);
setInterval(() => document.querySelectorAll('.reloj').forEach(n => {
  const [clase, texto] = relojEstado(n.dataset.inicio, n.dataset.estado);
  n.className = 'reloj ' + clase; n.textContent = texto;
}), 30000);

// Barra de probabilidad con la marca del mercado sin margen.
function barra(prob, mercado, lado) {
  const b = el('div', {class: 'barra ' + lado, role: 'img',
    'aria-label': `probabilidad ${pct(prob)}` + (vacio(mercado) ? '' : `, mercado ${pct(mercado)}`)},
    el('i', {style: `width:${Math.max(0, Math.min(1, prob)) * 100}%`}));
  if (!vacio(mercado)) b.append(el('b', {style: `left:calc(${mercado * 100}% - 1px)`}));
  return b;
}
// Fila de prop: quién y qué, probabilidad grande, barra, y precio.
function filaProp({jugador, lado, linea, prob, mercado, cuota, valor, media, minutos, notas, etiqueta}) {
  return el('div', {class: 'prop'},
    el('div', {class: 'linea1'},
      el('span', {}, el('span', {class: 'quien'}, jugador), ' ',
        el('span', {class: 'lado-' + lado}, `${lado === 'over' ? 'Over' : 'Under'} ${num(linea)}`), etiqueta ? ` ${etiqueta}` : ''),
      el('span', {class: 'prob'}, pct(prob))),
    barra(prob, mercado, lado),
    el('div', {class: 'linea2'},
      el('span', {}, `Proyección ${num(media)}`, vacio(minutos) ? '' : ` en ${num(minutos, 0)} min`),
      el('span', {class: 'precio'}, el('span', {}, vacio(cuota) ? 'sin cuota' : `Cuota ${num(cuota, 2)}`),
        vacio(valor) ? '' : el('span', {class: signo(valor)}, `VE ${ve(valor)}`))),
    notas ? el('div', {class: 'riesgo'}, notas) : '');
}
const avisos = texto => (texto || '').split('; ').filter(n => n && !n.startsWith('dispersión') && !n.startsWith('ajuste por'));

// Prop real: la línea de Stake (si hay) y la línea segura del modelo (75 % o más) para buscar en las alternativas.
const LADO = l => l === 'over' ? 'Over' : 'Under';
function propReal(p) {
  const stake = p.tipo === 'real' && p.casa && !p.casa.startsWith('Consenso') && p.alto;
  return [stake ? el('span', {class: 'lado-' + p.alto.lado}, `${LADO(p.alto.lado)} ${num(p.linea)}`, p.alto.cuota ? ` a ${num(p.alto.cuota, 2)}` : '')
                : el('span', {class: 'suave'}, 'Sin Stake'),
    // Con alternas de Stake la segura es una línea real con cuota; sin ellas, la del modelo (sin cuota).
    p.segura ? el('span', {class: 'bajo'}, `Segura: ${LADO(p.segura.lado)} ${num(p.segura.linea)}` +
      (p.segura.real ? ` a ${num(p.segura.cuota, 2)}, ${pct(p.segura.p)}` : `, ${pct(p.segura.p)} (modelo)`)) : ''];
}

// Foto oficial de la NBA; si no carga, se quita sin dejar hueco.
const urlFoto = (pid, tam) => `https://cdn.nba.com/headshots/nba/latest/${tam}/${pid}.png`;
function foto(j) {
  if (!j.pid) return '';
  const img = el('img', {src: urlFoto(j.pid, '260x190'), alt: '', loading: 'lazy', decoding: 'async', width: '64', height: '47'});
  const boton = el('button', {type: 'button', class: 'foto', 'aria-label': `Ver foto de ${j.j}`}, img);
  img.addEventListener('error', () => boton.remove());
  boton.addEventListener('click', () => ampliarFoto(j));
  return boton;
}
// Foto grande en un diálogo: se cierra tocando fuera, con la X o con Esc.
const visor = el('dialog', {class: 'visor', 'aria-label': 'Foto del jugador'});
document.body.append(visor);
visor.addEventListener('click', e => { if (e.target === visor) visor.close(); });
function ampliarFoto(j) {
  const cerrar = el('button', {type: 'button', class: 'cerrar', 'aria-label': 'Cerrar'}, '×');
  cerrar.addEventListener('click', () => visor.close());
  visor.replaceChildren(cerrar, el('img', {src: urlFoto(j.pid, '1040x760'), alt: j.j, width: '520', height: '380'}),
    el('div', {class: 'pie'}, el('strong', {}, j.j), el('span', {class: 'suave'}, j.p || j.eq || '')));
  visor.showModal();
}
// Rol según RotoWire: titular (confirmado o esperado) o suplente. Las dudas ya salen como estado.
const rolJugador = j => j.rol === 'titular' ? el('span', {class: 'rol'}, j.alin === 'confirmada' ? 'Titular confirmado' : 'Titular esperado')
  : j.rol === 'suplente' ? el('span', {class: 'rol suplente'}, 'Suplente') : '';

// El prop con más probabilidad de salir: primero entre las líneas de Stake (con cuota), si no, entre las de referencia.
function sugerida(j) {
  // Con líneas alternas de Stake: la línea real más probable del jugador entre todos sus mercados.
  const reales = MERCADOS.filter(k => j.props[k] && j.props[k].segura && j.props[k].segura.real).map(k => ({k, s: j.props[k].segura, p: j.props[k]}));
  if (reales.length) {
    const {k, s, p} = reales.reduce((a, b) => b.s.p > a.s.p ? b : a);
    return el('div', {class: 'sugerida ' + s.lado}, el('span', {class: 'etiqueta'}, 'Más segura'),
      el('strong', {}, `${NOMBRES[k]} ${LADO(s.lado)} ${num(s.linea)}`), el('span', {}, `a ${num(s.cuota, 2)}, ${pct(s.p)}`),
      el('span', {class: 'suave'}, `cumplió ${s.aciertos} de ${Math.min(10, (p.aciertos || [0, 10])[1])}`),
      vacio(s.ve) ? '' : el('span', {class: signo(s.ve)}, `VE ${ve(s.ve)}`));
  }
  const todos = MERCADOS.filter(k => j.props[k] && j.props[k].alto).map(k => ({k, p: j.props[k]}));
  const stake = todos.filter(x => x.p.tipo === 'real' && x.p.casa && !x.p.casa.startsWith('Consenso') && x.p.alto.cuota);
  const lista = stake.length ? stake : todos;
  if (!lista.length) return null;
  const {k, p} = lista.reduce((a, b) => b.p.alto.p > a.p.alto.p ? b : a);
  const lado = p.alto.lado, ac = p.aciertos;
  return el('div', {class: 'sugerida ' + lado}, el('span', {class: 'etiqueta'}, 'Más probable'),
    el('strong', {}, `${NOMBRES[k]} ${LADO(lado)} ${num(p.linea)}`),
    el('span', {}, stake.length ? `a ${num(p.alto.cuota, 2)}, ${pct(p.alto.p)}` : `${pct(p.alto.p)}, línea de referencia`),
    ac ? el('span', {class: 'suave'}, `cumplió ${ac[0]} de ${ac[1]}`) : '',
    stake.length && !vacio(p.alto.ve) ? el('span', {class: signo(p.alto.ve)}, `VE ${ve(p.alto.ve)}`) : '');
}

// Ficha de jugador con sus props.
function fichaJugador(j) {
  const filas = MERCADOS.filter(k => j.props[k]).map(k => {
    const p = j.props[k] || {};
    return el('tr', {}, el('td', {}, NOMBRES[k]), el('td', {}, num(p.l5)), el('td', {}, num(p.l10)), el('td', {}, num(p.temp)),
      el('td', {class: 'proy'}, num(p.media)),
      el('td', {}, vacio(p.linea) ? '—' : num(p.linea) + (p.tipo === 'ref' ? '*' : ''),
        p.aciertos ? el('span', {class: 'bajo'}, `${p.aciertos[0]} de ${p.aciertos[1]}`) : ''),
      el('td', {class: 'prop-real'}, propReal(p)),
      el('td', {}, p.alto ? el('span', {class: 'lado-' + p.alto.lado}, `${p.alto.lado === 'over' ? 'Over' : 'Under'} ${pct(p.alto.p)}`) : '—',
        !p.alto || vacio(p.alto.ve) ? '' : el('span', {class: 'bajo ' + signo(p.alto.ve)}, `VE ${ve(p.alto.ve)}`)));
  });
  const f = el('div', {class: 'ficha'},
    el('div', {class: 'encabezado'}, foto(j), el('span', {class: 'nombre'}, j.j, j.num ? el('span', {class: 'dorsal-jugador'}, ` #${j.num}`) : '', rolJugador(j)),
      j.est ? el('span', {class: 'estado-lesion ' + j.est}, j.est) : ''),
    el('div', {class: 'datos'}, el('span', {}, `${num(j.min)} min proyectados`), j.sd ? el('span', {}, `desviación ${num(j.sd)}`) : '',
      el('span', {}, `${j.n} partidos de muestra`)),
    el('table', {}, el('tr', {}, el('th', {}, ''), el('th', {}, 'L5'), el('th', {}, 'L10'), el('th', {}, 'Temp.'),
      el('th', {}, 'Proy.'), el('th', {}, 'Línea'), el('th', {}, 'Prop real'), el('th', {}, 'Más probable')), ...filas));
  if (j.otros.length) f.append(el('details', {class: 'escenarios'}, el('summary', {}, `Si falta un compañero (${j.otros.length})`),
    ...j.otros.map(o => el('div', {class: 'suave'}, `${o.esc}: ${num(o.min)} min, ${num(o.m.pts && o.m.pts[0])} pts, ${num(o.m.reb && o.m.reb[0])} reb, ${num(o.m.ast && o.m.ast[0])} ast`))));
  const s = sugerida(j);
  if (s) f.querySelector('.datos').after(s);
  const n = avisos(j.notas);
  if (n.length) f.append(el('div', {class: 'riesgo'}, n.join('. ')));
  return f;
}

// Mejores props de un partido: primero líneas reales por VE; luego, con línea de referencia, las más probables de
// jugadores con 20 minutos o más (para no premiar unders fáciles de suplentes).
function mejoresProps(jugadores) {
  const todas = [];
  for (const j of jugadores) for (const k of MERCADOS) {
    const p = j.props[k];
    if (!p || !p.lado || j.notas.includes('muestra insuficiente')) continue;
    if (p.tipo === 'ref' && (j.min || 0) < 20) continue;
    todas.push({j, k, p, orden: p.tipo === 'real' ? [0, -(p.ve ?? p.edge ?? -1)] : [1, -p.p_lado]});
  }
  return todas.filter(x => x.p.tipo === 'ref' || x.p.edge > 0)
    .sort((a, b) => a.orden[0] - b.orden[0] || a.orden[1] - b.orden[1]).slice(0, 8);
}
function vistaJuego(nombre) {
  const p = D.partidos.find(x => x.p === nombre);
  const jug = D.jugadores.filter(j => j.p === nombre);

    el('div', {class: 'titulo-juego'}, cruce(nombre), p ? reloj(p) : ''),
    p ? el('div', {class: 'suave pequeno'}, `${p.hora} hora de Panamá`, p.marcador ? `, final ${p.marcador}` : '',
      p.favorito ? `. Favorito ${p.favorito} (spread estimado)` : '') : ''];
  if (!jug.length) return out.concat(el('p', {class: 'vacio'}, 'No hay proyecciones para este partido.'));
  const mejores = mejoresProps(jug);
  out.push(el('h2', {class: 'seccion'}, 'Lo que el modelo empuja'));
  if (mejores.some(x => x.p.tipo === 'real') && !mejores.some(x => x.p.ve > 0))
    out.push(el('div', {class: 'aviso'}, 'Ninguna línea de Stake tiene ventaja (VE positivo): son las que el modelo inclina a favor, pero el margen de la casa las deja en negativo.'));
  if (!mejores.length) out.push(el('p', {class: 'suave'}, 'Ninguna prop destaca en este partido.'));
  const empuja = el('div', {class: 'rejilla'});
  out.push(empuja);
  for (const {j, k, p: q} of mejores) empuja.append(filaProp({jugador: j.j, lado: q.lado, linea: q.linea, prob: q.p_lado,
    mercado: q.p_mercado, cuota: q.tipo === 'real' && !String(q.casa).startsWith('Consenso') ? q.cuota : null, valor: q.ve,
    media: q.media, minutos: j.min, etiqueta: (['pra', 'pr', 'ra'].includes(k) ? NOMBRES[k] : NOMBRES[k].toLowerCase()) + (q.tipo === 'ref' ? '*' : ''),
    notas: [['Out', 'Doubtful', 'Questionable'].includes(j.est) ? j.est : '', j.sd > 6 ? 'minutos inestables' : '',
      j.notas.includes('riesgo de paliza') ? 'riesgo de paliza' : ''].filter(Boolean).join(', ')}));
  out.push(el('p', {class: 'nota'}, 'Con línea real, la probabilidad parte del mercado sin margen (la marca fina de la barra) y el modelo la mueve como mucho 4 puntos, porque todavía no le gana al mercado. VE es esa probabilidad por la cuota, menos 1. Con * la línea es de referencia (media de los últimos 10, sin cuota): solo indica hacia dónde se inclina el modelo. BET o PASS lo decide /parley.'));
  out.push(el('div', {class: 'rejilla'}, ...[...new Set(jug.map(j => j.eq))].map(equipo =>
    el('section', {}, el('h2', {class: 'equipo'}, equipo), ...jug.filter(j => j.eq === equipo).map(fichaJugador)))));
  return out;
}

    // Solo días con partidos jugados: los de hoy están en la pestaña Parley hasta que terminen.

    const resumen = [];
    if (pr && pr.decididos) resumen.push(`Propuestos antes del partido: ganaron ${pr.ganados} de ${pr.decididos}; por su probabilidad se esperaban ${num(pr.esperados, 1)}.`);
    for (const [tipo, c] of Object.entries((pr && pr.por_tipo) || {})) if (c.decididos && tipo !== 'un partido')
      resumen.push(`Con ${tipo}: ${c.ganados} de ${c.decididos} (esperados ${num(c.esperados, 1)}).`);

    if (!ln || !ln.n) return [...secParleys, el('p', {class: 'vacio'}, 'Aún no termina ningún partido con línea. Los resultados aparecen solos al terminar.')];
    const CORTO = {puntos: 'PTS', rebotes: 'REB', asistencias: 'AST', pra: 'PRA', pr: 'PR', ra: 'RA'};

        el('td', {}, `${CORTO[x.m] || x.m} ${x.lado} ${x.l}`), el('td', {}, pct(x.p)),
        el('td', {class: x.ok ? 'gano' : 'perdio'}, `${x.real} ${x.ok ? '✓' : '✗'}`))));
    const cuenta = legs => `${legs.filter(x => x.ok).length} de ${legs.length}`;
    let modo = 'partido'; try { modo = localStorage.getItem('resultados') || 'partido'; } catch (e) {}
    const cuerpo = el('div', {});  // Por partido va en rejilla (ver pintar).
    const botones = [['partido', 'Por partido'], ['prob', 'De mayor a menor']].map(([valor, texto]) => {
      const b = el('button', {type: 'button', 'aria-pressed': String(valor === modo)}, texto);
      b.addEventListener('click', () => { modo = valor; try { localStorage.setItem('resultados', valor); } catch (e) {} pintar(); });
      return b;
    });
    function pintar() {
      botones.forEach((b, i) => b.setAttribute('aria-pressed', String(['partido', 'prob'][i] === modo)));
      cuerpo.className = modo === 'prob' ? '' : 'rejilla';
      if (modo === 'prob') { cuerpo.replaceChildren(tabla(ln.ultimos, true)); return; }
      const grupos = new Map();
      for (const x of ln.ultimos) { const k = `${x.f}|${x.partido}`; if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(x); }
      const claves = [...grupos.keys()].sort((a, b) => b.split('|')[0].localeCompare(a.split('|')[0]) || a.localeCompare(b));

        if (i === 0) d.open = true;
        return d;
      }));

      el('table', {}, el('tr', {}, el('th', {}, 'Probabilidad'), el('th', {}, 'Líneas'), el('th', {}, 'Cumplió'), el('th', {}, 'Esperado')),
        ...cal.map(c => el('tr', {}, el('td', {}, `${Math.round(c.de * 100)} a ${Math.round(Math.min(c.a, 1) * 100)} %`), el('td', {}, String(c.n)),
          el('td', {class: 'proy'}, pct(c.aciertos / c.n)), el('td', {}, pct(c.esperados / c.n)))))];
    return [...secParleys, ...secCal, el('h2', {class: 'seccion'}, 'Props'),
      el('p', {class: 'nota'}, `Si se dieron o no las props con línea guardada, en el lado que el modelo veía más probable. Acertó ${ln.aciertos} de ${ln.n} (${pct(ln.aciertos / ln.n)}).` +
        (ln.n_mercado ? ` Error de probabilidad (Brier, menor es mejor): modelo ${num(ln.brier_modelo_vs, 3)}, mercado ${num(ln.brier_mercado, 3)}.` : '')),
      el('div', {class: 'selector', role: 'group', 'aria-label': 'Ordenar resultados'}, ...botones), cuerpo];

  Modelo() {
    const b = D.backtest;

    const out = [el('p', {class: 'nota'}, `${D.modelo}, backtest del ${b.fecha} con datos hasta ${D.corte || '—'}. Brier es el error de probabilidad (menor es mejor); L10 es acertar con el promedio de los últimos 10.`)];
    for (const [temp, m] of Object.entries(b.metricas)) out.push(el('section', {class: 'temporada'}, el('h2', {}, `Temporada ${temp}`),
      el('table', {}, el('tr', {}, el('th', {}, ''), el('th', {}, 'Brier modelo'), el('th', {}, 'Brier L10'), el('th', {}, 'Error medio'), el('th', {}, 'Rango 10-90')),

      el('table', {}, el('tr', {}, el('th', {}, ''), el('th', {}, 'Casos'), el('th', {}, 'Sesgo'), el('th', {}, 'Error medio'), el('th', {}, 'Rango 10-90'), el('th', {}, 'Factor')),
        ...Object.entries(r.por_stat).map(([s, v]) => el('tr', {}, el('td', {}, ESTADISTICAS[s] || s), el('td', {}, String(v.n)),
          el('td', {}, num(v.sesgo, 2)), el('td', {}, num(v.mae, 2)), el('td', {}, pct(v.cobertura_10_90)), el('td', {}, num(v.factor, 3)))))));
    const l = b.legs_reales;
    if (l && l.legs_decididos) out.push(el('section', {class: 'temporada'}, el('h2', {}, 'Tus legs reales'),
      el('table', {}, el('tr', {}, el('th', {}, ''), el('th', {}, 'Brier')),
        el('tr', {}, el('td', {}, 'App'), el('td', {}, num(l.comparables_brier_app, 3))),
        el('tr', {}, el('td', {}, 'Mercado'), el('td', {}, num(l.comparables_brier_mercado, 3))),
        el('tr', {}, el('td', {}, '/parley'), el('td', {}, num(l.comparables_brier_parley, 3)))),
      el('p', {class: 'nota'}, `${l.legs_comparables} de 100 legs comparables. ` + (l.muestra_suficiente ? 'Ya hay muestra para decidir.' : 'Hasta llegar a 100, la app es solo informativa.'))));
    return [out[0], el('div', {class: 'rejilla'}, ...out.slice(1))];
  },
};

const tabs = document.getElementById('tabs'), vista = document.getElementById('vista');

  actual = nombre;
  for (const b of tabs.children) b.setAttribute('aria-selected', b.textContent === nombre);

  try { localStorage.setItem('pestana', nombre); } catch (e) {}
}
// #juego=NOMBRE abre un partido; así el botón "atrás" del celular vuelve a la lista.
function ruta() {
  const m = location.hash.match(/^#juego=(.+)$/);
  if (m) {
    for (const b of tabs.children) b.setAttribute('aria-selected', b.textContent === 'Partidos');
    vista.replaceChildren(...vistaJuego(decodeURIComponent(m[1])));
    scrollTo(0, 0);
  } else mostrar(actual);
}
for (const nombre of Object.keys(vistas)) {
  const b = el('button', {role: 'tab'}, nombre);
  b.addEventListener('click', () => { actual = nombre; location.hash ? (location.hash = '') : mostrar(nombre); });
  tabs.append(b);
}
let guardada = null; try { guardada = localStorage.getItem('pestana'); } catch (e) {}
if (vistas[guardada]) actual = guardada;
addEventListener('hashchange', ruta);
ruta();
</script>
</body>
</html>
