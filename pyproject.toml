[project]
name = "panama-sports-analytics"
version = "0.1.26"
description = "Proyecciones NBA, NFL y Panama que alimentan /parley (uso personal)"
requires-python = ">=3.12"
dependencies = [
    "nba-api>=1.12.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pdfplumber>=0.11.10",
    "scipy>=1.18.1",
    "streamlit>=1.67.0",
]

[project.scripts]
actualizar = "psa.actualizar:main"
backtest = "psa.nba.backtest:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv.build-backend]
module-name = "psa"

[tool.pytest.ini_options]
testpaths = ["tests"]
